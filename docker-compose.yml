services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    # Sem "ports": o banco so existe na rede interna do compose.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
    depends_on:
      db: { condition: service_healthy }
    expose: ["3000"]

  # Ingestao e eval rodam como tarefas a parte, fora da imagem de runtime:
  #   docker compose run --rm app-tools                      (ingestao)
  #   docker compose run --rm app-tools npm run eval         (eval)
  app-tools:
    profiles: ["tools"]
    build: { context: ., target: tools }
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
    depends_on:
      db: { condition: service_healthy }

  caddy: # HTTPS automatico quando DOMAIN e um dominio publico
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data"]
    depends_on: [app]

volumes:
  pgdata: {}
  caddy_data: {}
